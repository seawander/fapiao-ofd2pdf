name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, which
        # would change the environment without any change on our side.
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Test
        run: pytest -q
